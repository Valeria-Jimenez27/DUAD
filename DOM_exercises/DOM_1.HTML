<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dynamic DOM list</title>
  </head>
  <body>
    <div>
      <button id="btn-add">Add element</button>
      <button id="btn-clean">Clear list</button>
      <ol id="my-list"></ol>
    </div>

    <script>
      const btnAdd = document.getElementById("btn-add");
      const btnClear = document.getElementById("btn-clean");

      const addElement = () => {
        const item = document.createElement("li");
        item.innerHTML = "New element";
        const list = document.getElementById("my-list");
        list.appendChild(item);
      };

      const cleanList = () => {
        const list = document.getElementById("my-list");
        list.innerHTML = "";
      };

      btnAdd.addEventListener("click", addElement);
      btnClear.addEventListener("click", cleanList);
    </script>
  </body>
</html>
