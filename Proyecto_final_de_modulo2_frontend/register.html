<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta | Vale's Pet Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
</head>

<body>
    <header class="site-header container">
        <a href="index.html" class="brand">
            <img src="img/products/logo-header.jpg" alt="Vale's Pet Store" class="brand__logo" />
        </a>
        <nav class="site-nav" id="site-nav" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="catalog.html">Catálogo</a>
            <a href="index.html#footer-contact">Contacto</a>
        </nav>
        <div class="flex-center" style="flex-direction: row; gap: var(--space-md);">
            <span class="user-status" id="user-status">Usuario: Invitado</span>
            <div class="auth-links" id="auth-links"></div>
        </div>
    </header>

    <main class="section container">
        <form class="form-card" id="register-form" novalidate style="width: min(100%, 32rem);">
            <h1 style="font-size: var(--fs-xl); margin-bottom: var(--space-lg);">Crear cuenta</h1>

            <div id="form-alert" class="alert alert--error" hidden></div>

            <div class="two-col" style="gap: var(--space-md);">
                <div class="field">
                    <label for="first-name">Nombre</label>
                    <input type="text" id="first-name" name="firstName" required />
                    <span class="field-error" id="first-name-error"></span>
                </div>

                <div class="field">
                    <label for="last-name">Apellido</label>
                    <input type="text" id="last-name" name="lastName" required />
                    <span class="field-error" id="last-name-error"></span>
                </div>
            </div>

            <div class="field">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email" required />
                <span class="field-error" id="email-error"></span>
            </div>

            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required />
                <span class="field-error" id="password-error"></span>
            </div>

            <div class="field">
                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password"
                    required />
                <span class="field-error" id="confirm-password-error"></span>
            </div>

            <div class="field">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone" name="phone" placeholder="Ej. 88887777" required />
                <span class="field-error" id="phone-error"></span>
            </div>

            <div class="field">
                <label for="address">Dirección de envío</label>
                <textarea id="address" name="address" rows="2" required></textarea>
                <span class="field-error" id="address-error"></span>
            </div>

            <button type="submit" class="btn btn--primary btn--full" id="submit-btn">Crear cuenta</button>

            <p class="text-muted" style="margin-top: var(--space-md); text-align: center;">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
            </p>
        </form>
    </main>

    <script type="module" src="js/header.js"></script>
    <script type="module" src="js/register.js"></script>
</body>

</html>
