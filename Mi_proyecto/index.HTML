<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="styles/main.css" />
</head>
<header>
    <div class="banner contain">
        <span><a>Login</a> or <a>Register</a> | TODAY'S DATE</span>
        <div>
            <span><a>Whishlist</a> | <a>Stores</a> | <a>My Account</a></span>
            <button class="banner-button">Language</button>
        </div>
    </div>
    </div>
    <nav class="navbar contain">
        <div class="nav-main">
            <button class="nav-brand"><img src="imgs/logo.jpg" alt="logo" class="brand-image"></button>
            <button class="nav-button">Home</button>
            <button class="nav-button">Shop</button>
            <button class="nav-button">Pages</button>
            <button class="nav-button">Blog</button>
            <button class="nav-button">Shortcodes</button>
            <button class="nav-button">Buy Now</button>
        </div>
        <div>
            <button class="icon-button"><img src="icons/search.svg" alt="search-icon" class="nav-icon"></button>
            <button class="icon-button"><img src="icons/cart.svg" alt="search-icon" class="nav-icon"></button>
        </div>
    </nav>
</header>

<body>
    <section>
        <div class="poster contain">
            <div class="poster-content">
                <div>
                    <p class="sup-text">We represent</p>
                    <p class="main-text">San José Street Style</p>
                </div>
                <button class="shop-button">Shop now</button>
            </div>
            <div><img src="imgs/model.jpg" alt="model" class="poster-image"></div>
        </div>
    </section>
    <main class="catalog contain">
        <div>
            <div class="title-container">
                <p class="main-title">Trending</p>
                <p class="sub-title">Most Trendy Clothes</p>
            </div>

        </div>
        <div class="product-rows">
            <div class="product">
                <div>
                    <img src="imgs/card1.jpg" alt="gymshark leggings" class="product-image">
                </div>
                <div class="product-info">
                    <div class="main-row"><span class="info-name">Gymshark Leggings</span> <button class="add-button">+</button></div>
                    <span>Gym</span>
                    <span class="price">$150</span>
                </div>
            </div>
            <div class="product">
                <div>
                    <img src="imgs/card2.jpg" alt="seamless tights" class="product-image">
                </div>
                <div class="product-info">
                    <div class="main-row"><span class="info-name">Seamless Tights</span> <button class="add-button">+</button></div>
                    <span>Gym</span>
                    <span class="price">$120</span>
                </div>
            </div>
            <div class="product">
                <div>
                    <img src="imgs/card3.jpg" alt="gymshark zip" class="product-image">
                </div>
                <div class="product-info">
                    <div class="main-row"><span class="info-name">Gymshark Zip</span> <button class="add-button">+</button></div>
                    <span>Gym</span>
                    <span class="price">$135</span>
                </div>
            </div>
            <div class="product">
                <div>
                    <img src="imgs/card4.jpg" alt="sportswear man" class="product-image">
                </div>
                <div class="product-info">
                    <div class="main-row"><span class="info-name">Gymshark T-Shirt</span> <button class="add-button">+</button></div>
                    <span>Gym</span>
                    <span class="price">$140</span>
                </div>
            </div>
        </div>
    </main>

</html>
